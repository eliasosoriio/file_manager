services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filemanager_app
    restart: unless-stopped
    ports:
      - "8765:8080"
    volumes:
      - .:/var/www/html
      - ${FILE_MANAGER_BASE_PATH}:/data:rw
    environment:
      - APP_ENV=prod
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=mysql://filemanager:filemanager_pass@db:3306/filemanager?serverVersion=8.0
      - FILE_MANAGER_BASE_PATH=/data
    depends_on:
      - db
    networks:
      - filemanager_network

  db:
    image: mysql:8.0
    container_name: filemanager_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: filemanager
      MYSQL_USER: filemanager
      MYSQL_PASSWORD: filemanager_pass
      MYSQL_ROOT_PASSWORD: root_pass_123
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - filemanager_network
    command: --default-authentication-plugin=mysql_native_password

networks:
  filemanager_network:
    driver: bridge

volumes:
  db_data:
    driver: local
